<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WikiMiniAtlas tiled globe prototype</title>
  <link rel="stylesheet" href="globe.css">
</head>
<body>
  <main>
    <div id="viewport">
      <canvas id="globe" aria-label="Interactive three-dimensional globe. Drag to orbit and pinch to zoom."></canvas>
      <nav id="labels" aria-label="Geographic labels"></nav>
    </div>
    <h1 class="visually-hidden">WikiMiniAtlas tiled globe</h1>
    <button class="map-button" id="button_plus" type="button" aria-label="Zoom in" title="Zoom in"></button>
    <button class="map-button" id="button_minus" type="button" aria-label="Zoom out" title="Zoom out"></button>
    <button class="map-button" id="button_target" type="button" aria-label="Center map" title="Center map"></button>
    <button class="map-button" id="button_fs" type="button" aria-label="Fullscreen" title="Fullscreen"></button>
    <button
      class="map-button"
      id="button_menu"
      type="button"
      aria-controls="controls"
      aria-expanded="false"
      aria-label="Map display settings"
      title="Map display settings"
    ></button>
    <form id="controls" aria-label="Map display settings" hidden>
      <label>
        <span>Body</span>
        <select id="body-set" aria-label="Celestial body"></select>
      </label>
      <label>
        <span>Map</span>
        <select id="tile-set" aria-label="Tile set"></select>
      </label>
      <label>
        <span>Labels</span>
        <select id="label-set" aria-label="Label language"></select>
      </label>
      <label title="Use a dark night side and a physical day/night terminator">
        <span>Light</span>
        <span class="checkbox-option">
          <input id="realistic-lighting" type="checkbox">
          Day/night
        </span>
      </label>
    </form>
    <div id="scalebox" role="img" aria-label="Map scale">
      <div class="scale-entry scale-metric">
        <span id="scale-metric-label" class="scale-label">— km</span>
        <span id="scale-metric-bar" class="scale-bar"></span>
      </div>
      <div class="scale-entry scale-imperial">
        <span id="scale-imperial-bar" class="scale-bar"></span>
        <span id="scale-imperial-label" class="scale-label">— mi</span>
      </div>
    </div>
    <p id="help" class="visually-hidden">Drag to orbit; pinch, scroll, or use the zoom buttons to zoom.</p>
    <p id="status" class="visually-hidden" role="status">Starting WebGL…</p>
    <p id="credit" hidden></p>
    <aside id="article-preview" aria-live="polite" hidden></aside>
    <p id="error" role="alert" hidden></p>
  </main>
  <script src="../min/poly2tri.min.js"></script>
  <script type="module" src="main.mjs"></script>
</body>
</html>
