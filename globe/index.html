<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WikiMiniAtlas tiled globe prototype</title>
  <link rel="stylesheet" href="globe.css">
</head>
<body>
  <main>
    <div id="viewport">
      <canvas id="globe" aria-label="Interactive three-dimensional globe. Drag to orbit and pinch to zoom."></canvas>
      <nav id="labels" aria-label="Geographic labels"></nav>
    </div>
    <h1 class="title">WikiMiniAtlas<span class="title-detail"> · tiled globe prototype</span></h1>
    <button
      id="controls-toggle"
      type="button"
      aria-controls="controls"
      aria-expanded="false"
      aria-label="Map display settings"
      title="Map display settings"
    ></button>
    <form id="controls" aria-label="Map display settings" hidden>
      <label>
        <span>Body</span>
        <select id="body-set" aria-label="Celestial body"></select>
      </label>
      <label>
        <span>Map</span>
        <select id="tile-set" aria-label="Tile set"></select>
      </label>
      <label>
        <span>Labels</span>
        <select id="label-set" aria-label="Label language"></select>
      </label>
    </form>
    <p id="help">Drag to orbit · pinch or scroll to zoom</p>
    <p id="status" role="status">Starting WebGL…</p>
    <p id="credit" hidden></p>
    <p id="error" role="alert" hidden></p>
  </main>
  <script type="module" src="main.mjs"></script>
</body>
</html>
